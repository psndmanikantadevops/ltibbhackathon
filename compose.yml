services:
  mysqldb:
    container_name: mysqldb
    image: shaikmustafa77/hussian:db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  application:
    container_name: mycont
    image: shaikmustafa77/hussian:app
    ports:
      - "1212:80"
    depends_on:
      - mysqldb
    restart: unless-stopped

volumes:
  mysql_data:
      
    
